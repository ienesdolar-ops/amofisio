<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel Sympla Inspirar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: escolha da unidade → página da unidade (próximos eventos em cartões, realizados abaixo) */
:root{
  --bg:#f4f6f8; --panel:#fff; --ink:#14202b; --muted:#5d6b78; --line:#dde3e9;
  --accent:#0b7a75; --accent-soft:#d9efed; --warn:#a35f00; --warn-soft:#fbecd5; --bad:#b3261e; --bad-soft:#f8dedb;
  --sans:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f161c; --panel:#17212a; --ink:#e7edf2; --muted:#98a6b3; --line:#26333e;
  --accent:#3cc2b9; --accent-soft:#16302f; --warn:#e8a33d; --warn-soft:#33270f; --bad:#f2786f; --bad-soft:#3a1d1b; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:28px;margin:0 0 4px;font-weight:800;text-wrap:balance}
h2{font-size:20px;margin:32px 0 12px}
.muted{color:var(--muted)}
.upd{color:var(--muted);font-size:13px;margin-top:6px}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* escolha de unidade */
.busca{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);margin:20px 0}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.u{display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:12px;background:var(--panel);border:2px solid var(--line);text-decoration:none;transition:border-color .15s}
.u:hover{border-color:var(--accent)}
.u b{font-size:19px}
.u span{color:var(--muted);font-size:14px}

/* página da unidade */
.voltar{display:inline-flex;gap:6px;align-items:center;font-weight:600;text-decoration:none;color:var(--accent);margin-bottom:16px}
.resumo{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.resumo div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;flex:1;min-width:140px}
.resumo b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.resumo span{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card .quando{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.data{font-weight:700}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.breve{background:var(--warn-soft);color:var(--warn)}
.pill.cancel{background:var(--bad-soft);color:var(--bad)}
.card h3{margin:0;font-size:17px;line-height:1.3;text-wrap:balance}
.card .local{font-size:14px;color:var(--muted)}
.insc{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.insc b{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.insc span{color:var(--muted)}
.btn{display:block;text-align:center;padding:10px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
.passados{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.passados summary{padding:14px 18px;cursor:pointer;font-weight:700}
.prow{display:flex;justify-content:space-between;gap:16px;padding:10px 18px;border-top:1px solid var(--line)}
.prow div{min-width:0}
.prow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.copiar{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Carregando…</p></div>
<script>
const app = document.getElementById('app');
const fmt = n => n == null ? '—' : n.toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const DIA = 864e5;
let EV = [], UNITS = [], UPD = '';

const label = e => e.unidade;
const dataLonga = d => new Date(d).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'long'});
const dataCurta = d => new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
function falta(e){
  if (e.cancelado) return ['Cancelado','cancel'];
  const dias = Math.ceil((new Date(e.inicio) - Date.now())/DIA);
  if (dias <= 0) return ['Acontecendo','breve'];
  if (dias === 1) return ['É amanhã','breve'];
  if (dias <= 7) return [`Faltam ${dias} dias`,'breve'];
  return [`Faltam ${dias} dias`,''];
}
const futuro = e => new Date(e.fim||e.inicio).getTime() >= Date.now();

function home(){
  app.innerHTML = `
    <h1>Inscrições dos eventos</h1>
    <div class="muted">Escolha a sua unidade para ver quantas pessoas já se inscreveram.</div>
    <div class="upd">${UPD}</div>
    <input class="busca" id="busca" type="search" placeholder="Digite o nome da sua cidade…" aria-label="Buscar unidade">
    <div class="units" id="units"></div>`;
  const draw = q => {
    q = slug(q||'');
    document.getElementById('units').innerHTML = UNITS.filter(u=>!q||u.slug.includes(q)).map(u =>
      `<a class="u" href="#${u.slug}"><b>${esc(u.nome)}</b><span>${u.prox ? `${u.prox} ${u.prox>1?'eventos':'evento'} pela frente · ${fmt(u.inscProx)} inscritos` : 'Nenhum evento marcado'}</span></a>`
    ).join('') || '<div class="vazio">Nenhuma cidade com evento marcado tem esse nome.</div>';
  };
  draw();
  document.getElementById('busca').oninput = e => draw(e.target.value);
}

function unidade(u){
  const evs = EV.filter(e => label(e)===u.nome);
  const prox = evs.filter(e=>futuro(e) && !e.cancelado).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const canc = evs.filter(e=>futuro(e) && e.cancelado);
  const pass = evs.filter(e=>!futuro(e) && !e.cancelado).sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const totProx = prox.reduce((s,e)=>s+(e.inscritos||0),0);
  const card = e => { const [t,c] = falta(e); return `
    <article class="card">
      <div class="quando"><span class="data">${dataLonga(e.inicio)}</span><span class="pill ${c}">${t}</span></div>
      <h3>${esc(e.nome)}</h3>
      ${e.local?`<div class="local">${esc(e.local)}</div>`:''}
      <div class="insc"><b>${fmt(e.inscritos)}</b><span>${e.inscritos===1?'inscrito':'inscritos'}</span></div>
      ${e.url&&!e.cancelado?`<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Abrir página de inscrição</a>`:''}
    </article>`; };
  app.innerHTML = `
    <a class="voltar" href="#">← Todas as unidades</a>
    <h1>${esc(u.nome)}</h1>
    <div class="upd">${UPD}</div>
    <button class="copiar" id="copiar">Copiar link desta unidade</button>
    <div class="resumo">
      <div><b>${prox.length}</b><span>eventos pela frente</span></div>
      <div><b>${fmt(totProx)}</b><span>pessoas inscritas neles</span></div>
      <div><b>${prox[0]?dataCurta(prox[0].inicio):'—'}</b><span>próximo evento</span></div>
    </div>
    <h2>Próximos eventos</h2>
    ${prox.length ? `<div class="cards">${prox.map(card).join('')}</div>` : '<div class="vazio">Nenhum evento marcado para esta unidade no momento.</div>'}
    ${canc.length ? `<h2>Cancelados</h2><div class="cards">${canc.map(card).join('')}</div>` : ''}
    ${pass.length ? `<h2>Já realizados</h2><details class="passados"><summary>Ver ${pass.length} eventos realizados</summary>
      ${pass.map(e=>`<div class="prow"><div>${esc(e.nome)}<div class="muted" style="font-size:14px">${dataCurta(e.inicio)}</div></div><b>${fmt(e.inscritos)} inscritos</b></div>`).join('')}</details>` : ''}`;
  const b = document.getElementById('copiar');
  b.onclick = () => navigator.clipboard.writeText(location.href).then(()=>b.textContent='Link copiado ✓').catch(()=>b.textContent=location.href);
  scrollTo(0,0);
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const u = UNITS.find(x=>x.slug===h);
  u ? unidade(u) : home();
}

fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  EV = d.events.filter(e=>e.inicio);
  UPD = 'Atualizado em ' + new Date(d.atualizadoEm).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) + ' · os números são atualizados todo dia às 6h';
  const m = new Map();
  EV.forEach(e => { const k=label(e); if(!m.has(k)) m.set(k,{nome:k,slug:slug(k),prox:0,inscProx:0});
    if (futuro(e)&&!e.cancelado){ const u=m.get(k); u.prox++; u.inscProx+=e.inscritos||0; } });
  UNITS = [...m.values()].filter(u=>u.prox>0).sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
  route();
}).catch(()=>{ app.innerHTML='<h1>Inscrições dos eventos</h1><div class="vazio">Os números ainda não foram gerados. Volte em alguns minutos.</div>'; });
addEventListener('hashchange', route);
</script>
</body>
</html>
